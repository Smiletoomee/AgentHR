services:

#   CADDY - Proxy
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
#    ports:
#      - "8080:80"
#      - "80:80"
#      - "443:443"
    volumes:
      - ./logs/caddy:/var/log/caddy
      - ./caddy_data:/data
      - ./caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - monitoring

# #POSTGRES - BAZA
  postgres:
    image: postgres:19beta3-trixie
    ports:
      - "5434:5432"
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql
    networks:
      - monitoring
    env_file:
      - .env

  # pgadmin:
